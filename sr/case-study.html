<link rel="stylesheet" href="../v2.css" />
<script>
  // motion classes go on before first paint so nothing flashes in place
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('motion');
    // safety: if the scripts never run, show everything anyway
    setTimeout(() => window.hsMotionReady || document.documentElement.classList.add('motion-failsafe'), 3500);
  }
</script>
</head>
<body>

<!-- NAV -->
<header class="nav" id="nav">
  <a href="index.html" class="nav-logo" aria-label="hipspace"><span class="logo-mark" aria-hidden="true"></span></a>
  <div class="nav-right">
    <nav class="nav-links">
      <a href="about.html">O studiju</a>
      <a href="work.html">Radovi</a>
    </nav>
    <a href="inquiry.html" class="btn btn-pink">Započni projekat</a>
    <a href="../case-study.html" class="nav-lang" hreflang="en" lang="en">EN</a>
  </div>
</header>

<main>

  <!-- THE PROJECT: one dark run, no hero. The cover first, then the project
       name and the kind of work, the live link and what was done, the summary,
       then the pictures with the story's parts (challenge, approach,
       decisions) set in between them by case-study.js -->
  <section class="cs-main dark">
    <figure class="cs-cover" id="cs-cover" data-fade></figure>
    <div class="cs-head" data-fade>
      <h1 class="cs-title" id="cs-name"></h1>
      <p class="cs-meta" id="cs-meta"></p>
    </div>
    <div class="cs-bar" data-fade>
      <ul class="svc-get cs-pills" id="cs-scope" aria-label="Šta smo radili"></ul>
      <a class="btn" id="cs-site" href="#" target="_blank" rel="noopener">Pogledaj sajt</a>
    </div>
    <p class="cs-body" id="cs-body" data-fade></p>
    <div class="cs-flow" id="cs-flow"></div>
  </section>

  <!-- MORE WORK: the other case studies, as the work page's cards -->
  <section class="work dark cs-more">
    <h2 class="sec-title" data-split>Još radova</h2>
    <div class="work-grid" id="cs-more-grid"></div>
    <div class="cursor-bubble" id="cursor-bubble" aria-hidden="true">Pogledaj</div>
  </section>

</main>

<!-- FOOTER: contacts and the call to action on top, the logo huge underneath -->
<footer class="footer dark">
  <div class="footer-top">
    <div class="footer-contacts">
      <a href="mailto:alex@hipspacestudio.com">alex@hipspacestudio.com</a>

    </div>
    <a href="inquiry.html" class="btn">Započni projekat</a>
  </div>
  <a href="index.html" class="footer-mark" aria-label="hipspace"><span class="logo-mark" aria-hidden="true"></span></a>
  <p class="footer-copy">© 2026 hipspacestudio</p>
</footer>

<script src="../common.js"></script>
<script src="../case-study.js"></script>
